services:
  mongodb:
    image: mongo:8
    container_name: hvn-mongodb
    restart: unless-stopped
    entrypoint:
      - /bin/bash
      - -c
      - |
        mkdir -p /data/keyfile
        if [ ! -f /data/keyfile/mongo-keyfile ]; then
          openssl rand -base64 756 > /data/keyfile/mongo-keyfile
          chmod 400 /data/keyfile/mongo-keyfile
          chown 999:999 /data/keyfile/mongo-keyfile
        fi
        (
          until mongosh -u "$${MONGO_INITDB_ROOT_USERNAME}" -p "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "rs.status().ok" 2>/dev/null | grep -q "1"; do
            mongosh -u "$${MONGO_INITDB_ROOT_USERNAME}" -p "$${MONGO_INITDB_ROOT_PASSWORD}" --authenticationDatabase admin --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]})" 2>/dev/null || true
            sleep 2
          done
        ) &
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/keyfile/mongo-keyfile

    ports:
      - "${MONGO_PORT:-27017}:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

    volumes:
      - hvn_mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "mongosh -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval 'rs.status().ok' | grep -q '1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s


  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: hvn-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${BACKEND_PORT:-3000}
      HOST: ${HOST:-0.0.0.0}
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
    container_name: hvn-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3030}:3030"
    depends_on:
      - backend

volumes:
  hvn_mongodb_data: